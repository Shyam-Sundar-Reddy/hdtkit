[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "hdtkit"
version = "0.2.0"
description = "Convert between RDF Turtle (.ttl) and HDT (.hdt) — ttl2hdt, hdt2ttl, hdtcat."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Shyam-Sundar-Reddy/hdtkit"
Repository = "https://github.com/Shyam-Sundar-Reddy/hdtkit"

[tool.maturin]
manifest-path = "rust/hdtkit-core/Cargo.toml"
python-source = "src"
module-name = "hdtkit._native"
