[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hdtkit"
version = "0.1.0"
description = "Convert between RDF Turtle (.ttl) and HDT (.hdt) — ttl to hdt, hdt to ttl."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hdtkit = "hdtkit.cli:app"

[project.urls]
Homepage = "https://github.com/Shyam-Sundar-Reddy/hdtkit"
Repository = "https://github.com/Shyam-Sundar-Reddy/hdtkit"

[tool.hatch.build.targets.wheel]
packages = ["src/hdtkit"]
