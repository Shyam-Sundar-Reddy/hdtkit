name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/hdtkit-core

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package with dev extras (builds the Rust extension via maturin)
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `uv build`/plain `maturin build` on a regular ubuntu-latest runner tags
      # the wheel `linux_x86_64`, which PyPI rejects for binary wheels (needs a
      # manylinux tag). maturin-action builds inside the standard manylinux
      # docker image so the wheel comes out correctly tagged.
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          manylinux: auto
          # No bare `python3` on PATH in the manylinux image by default (it's
          # only under /opt/pythonX.Y/bin/...) — `--find-interpreter` is
          # maturin's own flag to search those known locations instead of
          # just trying `python3`/`python`. (Not an action input: an earlier
          # attempt passed `interpreter:` here, which this action version
          # doesn't have — it warned and silently no-opped.)
          args: --release --out dist --find-interpreter

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      # NOTE: this only produces a Linux wheel + sdist. Windows/macOS wheels
      # land in Phase 6 (this same maturin-action, matrixed across OS).
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
