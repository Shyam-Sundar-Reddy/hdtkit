name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/hdtkit-core

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package with dev extras (builds the Rust extension via maturin)
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `uv build`/plain `maturin build` on a regular ubuntu-latest runner tags
      # the wheel `linux_x86_64`, which PyPI rejects for binary wheels (needs a
      # manylinux tag). maturin-action builds inside the standard manylinux
      # docker image so the wheel comes out correctly tagged.
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          manylinux: auto
          # No bare `python3` on PATH in the manylinux image by default (it's
          # only under /opt/pythonX.Y/bin/...). `--interpreter` (a maturin CLI
          # flag, NOT the action's own `interpreter:` input — that doesn't
          # exist on this action version and silently no-ops) searches those
          # known locations, scoped to the versions we actually support.
          # `--find-interpreter` (tried first) searches unscoped and also
          # picked up this image's cp314, which PyO3 0.23.5 doesn't support yet.
          args: --release --out dist --interpreter python3.12 python3.13

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      # NOTE: this only produces a Linux wheel + sdist. Windows/macOS wheels
      # land in Phase 6 (this same maturin-action, matrixed across OS).
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Lets a re-tagged retry (e.g. after fixing a packaging bug in one
          # file) skip files a previous run already got onto PyPI instead of
          # failing on "File already exists".
          skip-existing: true
