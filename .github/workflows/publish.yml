name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/hdtkit-core

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package with dev extras (builds the Rust extension via maturin)
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

  # Phase 6: prebuilt wheels like orjson/pydantic-core ship, so `pip install
  # hdtkit` doesn't need a Rust toolchain on the user's machine. One job per
  # platform family; Linux/musllinux build both interpreters in one docker
  # run each (matches how those images are laid out), Windows/macOS matrix
  # over Python version instead since maturin-action builds against whatever
  # `actions/setup-python` put on PATH there.

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Plain `uv build`/`maturin build` on a bare ubuntu-latest runner tags
      # the wheel `linux_x86_64`, which PyPI rejects for binary wheels (needs
      # a manylinux tag). maturin-action builds inside the standard manylinux
      # docker image so the wheel comes out correctly tagged.
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          manylinux: auto
          # No bare `python3` on PATH in the manylinux image by default (it's
          # only under /opt/pythonX.Y/bin/...). `--interpreter` (a maturin CLI
          # flag, NOT the action's own `interpreter:` input — that doesn't
          # exist on this action version and silently no-ops) searches those
          # known locations, scoped to the versions we actually support.
          # `--find-interpreter` searches unscoped and also picks up this
          # image's cp314, which PyO3 0.23.5 doesn't support yet.
          args: --release --out dist --interpreter python3.12 python3.13

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  # musl libc distros (Alpine and its Docker images) don't match the manylinux
  # (glibc) wheel above, so pip falls back to the sdist there — which then
  # needs a Rust toolchain, and worse, the auto-bootstrapped one pip tries to
  # download is itself glibc-linked and just crashes on musl. A dedicated
  # musllinux wheel avoids all of that.
  build-linux-musl:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build musllinux wheel
        uses: PyO3/maturin-action@v1
        with:
          manylinux: musllinux_1_2
          args: --release --out dist --interpreter python3.12 python3.13

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-musl
          path: dist/

  build-windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.python-version }}
          path: dist/

  build-macos:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # universal2 = one wheel covering both Intel and Apple Silicon Macs,
      # instead of matrixing macos x86_64/aarch64 as separate jobs too.
      - name: Build universal2 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.python-version }}
          path: dist/

  publish:
    needs: [build-linux, build-linux-musl, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Lets a re-tagged retry (e.g. after fixing a packaging bug in one
          # file) skip files a previous run already got onto PyPI instead of
          # failing on "File already exists".
          skip-existing: true
