name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/hdtkit-core

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package with dev extras (builds the Rust extension via maturin)
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/hdtkit-core

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # NOTE: this only produces a Linux (manylinux) wheel + sdist, since it
      # builds on ubuntu-latest. Multi-platform wheels (Windows/macOS) land
      # in Phase 6 via cibuildwheel.
      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
