[package]
name = "hdtkit-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# Module name Python imports as `hdtkit._native`.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
hdt = { version = "0.7.3", features = ["nt"] }
oxrdf = "0.3.3"
oxttl = "0.2.3"
pyo3 = { version = "0.23", features = ["extension-module"] }
